# 塵世百味 全局配置
#
# 本文件默認打包在 jar 內，插件首次啓動時會自動釋放到 plugins/WorldTaste/config.yml。
# 之後以 plugins/WorldTaste/config.yml 為準（改完重啓服務器生效，不建議熱重載）。
# 若刪除該文件，下次啓動會重新釋放一份默認配置。

# 釀造工藝（榨汁盆 / 酒窖管理器 / 温度控制器 / 果渣 / 甜度試紙 / 果酒 等）玩法總開關
brewing:
  # true = 開啓玩法；false = 關閉玩法（默認值：true，即默認開啓釀造玩法）
  #
  # 關閉後：
  #   1. 釀造工藝分組（ws_niangzaogongyi）下的機器與物品一律不再註冊——無法合成、
  #      無法放置使用，榨汁盆/酒窖/甜度試紙相關監聽與配方（juicer.yml、cellar.yml、
  #      sugar.yml）也不再加載；
  #   2. 但指南中的「釀造工藝」分類按鈕仍然保留（不從菜單刪除），僅在其名稱後
  #      追加「已禁用」字樣（見下方 disabled-suffix），分組內保留一張佔位説明頁
  #      （WT_NIANZAO_DISABLED）以免空分組被指南過濾。
  enabled: true

  # 關閉時在分類名稱後面追加的字樣（支持 & 顏色碼；留空則不追加）。
  # 默認 "&r&c&l已禁用"：&r 用於斷開分類名末尾可能殘留的 &k（亂碼）等格式碼。
  disabled-suffix: "&r&c&l已禁用"
