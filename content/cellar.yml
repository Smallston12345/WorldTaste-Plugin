# 酒窖配方表（酒窖管理器）
#
# 匹配為  ###按材料份數###（原料數量，與液位線顯示口徑一致）：池內各原料的總份數
# （每單位果汁按其組成折算材料數，如 1 單位甜漿果汁 = 3 份甜漿果）與 ingredient 數量
# 成整數倍比例（k 倍）時匹配，優先產出配方產物：
#   投入 2 單位蘋果汁（2 蘋果）+ 1 單位甜漿果汁（3 甜漿果）→ 產出 3 單位水果酒；
#   投入 4 單位蘋果汁 + 2 單位甜漿果汁 → 產出 6 單位水果酒（成比例放大）。
# 產出單位數 = 池內果汁總單位數（清水稀釋也計入單位數，但會稀釋糖分降低酒精度）。
#
#   ingredient  材料份數：每行「材料id:數量」（id 為材質名或粘液物品 id，即果汁原料
#               ref；數量 = 該原料的總份數，與榨汁盆配方的材料寫法一致）
#   aging       是否允許陳釀：true = 產物含酒精，可陳化增長酒精度；
#               false = 副產物，無酒精度（陳化模式會拒絕啓動）
#   result      每單位產物：與 items.yml 的 item 段同構（material_type/material/name/lore/amount）
#
# options  全局選項：
#   cellar-name 是否開啓酒窖命名功能（左下角命名牌按鈕；開啓後被命名酒窖
#               灌裝出的產物 lore 尾部會附上酒窖名）
#   test-mode   測試模式：true = 釀造啓動後立即完成（便於調試）；
#               false = 正式時長 20~40 分鐘（隨機）
options:
  cellar-name: true
  test-mode: true
SHUIGUOJIU:
  ingredient:
    - APPLE:2
    - SWEET_BERRIES:3
  aging: true
  result:
    material_type: mc
    material: POTION
    name: '&6&l水果酒'
    lore:
      - '&7蘋果與甜漿果汁混合釀造'
    amount: 1


