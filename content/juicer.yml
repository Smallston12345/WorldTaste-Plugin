  progress: 10
  bottle:
    material: POTION
    name: '&f&l混合果汁'
    lore: ['&7多種水果混合榨取']
  bucket:
    material: WATER_BUCKET
    name: '&f&l混合果汁桶'
    lore: ['&7滿滿一桶混合果汁']

# ===== 配方（多材料 + 數量）=====
#   ingredient  投入物列表，每行「id:數量」（id 為材質名或粘液物品 id，數量缺省 1）
#   type        壓榨方式（支持逗號分隔多值）：player = 玩家站在盆內跳躍踩踏（每次 +1）；
#               anvil = 鐵砧砸在盆頂（每次 +4）；player,anvil = 兩種方式均可
#   progress    總進度（動作欄顯示 當前/總進度）
#   yield       配方單份的接取份數（1~3，默認 3；配方按投入數量的整數倍成比例產出：
#               例「1 蘋果 yield 1」→ 投 2 個蘋果榨出 2 水位 2 份蘋果汁；
#               非(倍)數匹配且全部可混合時走混合配方）
#   result      每份產物：與 items.yml 的 item 段同構（material_type/material/name/lore/amount）
#
# 榨汁完成時按投入材料總數量掉落「果渣」（可食用，+1 飽食度）。
