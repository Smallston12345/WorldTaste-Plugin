# 榨汁盆配置表（WT_ZHAPEN，機器位於 釀造工藝 分組）
#
# ===== 全局設置 =====
# 是否在踩踏產物的 lore 末尾追加榨汁信息；false = 不追加
player-names: true
# 榨汁信息 lore 行格式（player-names: true 時生效，支持 & 顏色代碼）
# 佔位符：%playername% = 參與榨汁的玩家名（多人以「、」分隔），%time% = 榨好時間
player-names-format: '&7裏面有 &b%playername% 的味道'
# 是否啓用鐵砧損耗：false = 鐵砧砸落後永不損壞（留在盆頂，可回收再用）
#                   true  = 每次砸落按下方概率降低鐵砧耐久（ANVIL→CHIPPED→DAMAGED→碎裂）
anvil-damage: true
# 鐵砧損耗概率（1~10，數字越大越容易損壞，實際概率 = 數值/10，每次砸落判定一次）
anvil-damage-chance: 3
# 糖分→酒精度轉化比率（酒窖釀造：最終酒精度 = 總糖分 × 比率 + 酒麴加成）
sugar-alcohol-ratio: 0.3
# 陳化每遊戲日（24 分鐘）酒精度增長百分比區間，格式 min~max（實際增長 = 當前酒精度 × 隨機區間值）
aging-growth: 0.05~0.15
# 陳釀果酒 lore 信息行格式（&顏色代碼；佔位符 %players% 榨汁玩家、%contents% 組成果汁、%alcohol% 酒精度）
wine-lore-format: '&7| &b%contents% &7| &c酒精度: &e%alcohol%°' 
# 成品酒（通用陳釀果酒 + 所有配方酒）的組成物品是否顯示在 lore 中
wine-show-contents: true
# 組成物品顯示方向：true = 豎向（每個材料單獨一行，前置 • 列表符）；false = 橫向（頓號分隔一行）
wine-contents-vertical: true

# ===== 可混合配置 =====
# recipes: 可混合材料列表（材質名或粘液物品 id）。配方全部不匹配時，盆內全部為可混合
#          材料的組合會進入混合榨汁（同樣需要踩踏 progress 次），水量恆為 3 份。
# 瓶子（玻璃瓶）每次接取 1 份，含水等級 -1；桶僅滿盆時可一次接取全部並清空，
# 未滿時提示「這個盆不是滿的」。混合產物 lore 標註內容物（含數量）；桶裝產物禁止倒出。
